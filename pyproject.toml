[project]
name = "cadencia-docs"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4"]
ignore = ["E501", "N999"]

[tool.ruff.lint.per-file-ignores]
"docs/hooks.py" = ["ALL"]
"docs/_infra/cloudflare/espelhar.py" = ["ALL"]
